name: Devcontainer to Docker Image build and push

on:
  push:
    branches: [ "main" ]
    paths:
      - .devcontainer/**
      - .github/workflows/docker-image.yml

jobs:
  push_to_registry:
    name: Build and Push Docker image to registry
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Build and push Docker image
      #   id: push
      #   uses: docker/build-push-action@v6
      #   working-directory: ./.devcontainer/
      #   with:
      #     file: ./.devcontainer/Dockerfile
      #     push: true
      #     tags: artyomboyko/yandex-ml_2.0-training:latest

      - name: Build Docker image
        id: build
        run: pwd && docker build -t artyomboyko/yandex-ml_2.0-training:latest ./
        working-directory: ./.devcontainer/
      
      - name: Push Docker image
        id: push
        run: docker push artyomboyko/yandex-ml_2.0-training:latest
        working-directory: ./.devcontainer/